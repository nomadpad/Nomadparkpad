<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Group | Nomad Park Pad</title>

  <link rel="stylesheet" href="groups.css">
</head>

<body class="groups-page">

  <main class="groups-shell">

    <header class="groups-header">

      <a
        class="groups-back"
        href="groups.html"
      >
        ← Groups
      </a>

      <p class="groups-kicker">
        PRIVATE MAP GROUP
      </p>

      <h1 id="groupRoomName">
        Loading Group...
      </h1>

      <p
        class="groups-intro"
        id="groupRoomDescription"
      >
        Loading group details...
      </p>

    </header>


    <section class="group-room-card">

      <div class="group-room-badge">
        <span id="groupRoomBadge">👥</span>
      </div>

      <div class="group-room-info">

        <p class="group-room-label">
          PRIVATE JOIN CODE
        </p>

        <strong id="groupRoomJoinCode">
          ------
        </strong>

      </div>

    </section>


    <section class="groups-list-section">

      <div class="groups-section-heading">

        <h2>Members</h2>

        <p>
          Travellers in this private map group.
        </p>

      </div>

      <div
        class="groups-empty-state"
        id="groupMembersLoading"
      >

        <span>👥</span>

        <h3>Loading members...</h3>

      </div>

      <div
        class="groups-list"
        id="groupMembersList"
      ></div>

    </section>

  </main>


  <script
    type="module"
    src="group.js"
  ></script>

</body>

</html>
