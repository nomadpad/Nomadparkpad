<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Step 2 • Photos | Nomad Park Pad</title>

  <link rel="stylesheet" href="host-photos.css">

</head>

<body class="host-photos-page">

  <!-- HEADER -->

  <header class="photo-hero">

    <div class="hero-left">

      <img src="logo.png" class="hero-logo" alt="Nomad Park Pad">

      <p class="step-label">Step 2 of 7</p>

      <h1>Add Great Photos</h1>

      <p class="hero-text">

        Travellers book with their eyes first.

        A few clear photos can dramatically increase bookings.

      </p>

    </div>

  </header>

  <!-- JOURNEY -->

  <section class="journey-panel">

    <!-- Reuse the exact journey bar from Page 1 -->

  </section>

  <!-- PHOTO CARD -->

  <section class="photo-card">

      <div class="camera-icon">📷</div>

      <h2>Upload Your Photos</h2>

      <p>

        Show travellers where they'll park and what to expect.

      </p>

      <label class="upload-box">

          <input type="file" multiple hidden>

          <span>Choose Photos</span>

      </label>

      <div id="photoPreview" class="photo-preview">

      </div>

      <div class="photo-tips">

          <div>✓ Show the full parking space</div>

          <div>✓ Daylight photos work best</div>

          <div>✓ Include the entrance if needed</div>

      </div>

      <button class="continue-btn">

          Continue →

      </button>

  </section>

</body>

</html>
