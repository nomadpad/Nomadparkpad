<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Map | Nomad Park Pad</title>

  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">

  <link rel="stylesheet" href="styles.css">

  <link rel="stylesheet" href="find.css">

</head>

<body>

  <main class="map-only-page">

    <section class="map-view-section">

      <div id="map-message" class="map-message" hidden></div>

      
<div id="traveller-map" class="traveller-map"></div>

<div class="map-top-controls">

  <a

    href="/traveller-dashboard.html"

    class="map-top-button map-dashboard-button"

  >

    ← Dashboard

  </a>

  <button

    class="map-top-button map-search-button"

    id="map-search-button"

    type="button"

  >

    🔍 Search

  </button>

  <button

    class="map-top-button map-trip-button"

    id="trip-planner-button"

    type="button"

  >

    🧭 Trip Planner

  </button>

<div class="map-search-panel" id="mapSearchPanel" hidden>

  <input

    id="mapSearchInput"

    type="search"

    placeholder="Search a city, address, or place"

    autocomplete="off"

  >

  <button class="btn btn-primary" id="mapSearchSubmit" type="button">

    Go

  </button>

</div>
<div class="trip-planner-panel" id="tripPlannerPanel" hidden>

  <button

    class="trip-planner-close"

    id="tripPlannerClose"

    type="button"

    aria-label="Close trip planner"

  >

    ×

  </button>

  <h2>Freedom Starts Here</h2>

  <div class="trip-planner-layout">

    <div class="trip-planner-brand">

      <img

        src="image.jpeg"

        alt="Nomad Park Pad"

        class="trip-planner-logo"

      >

    </div>

    <div class="trip-planner-card">

      <h3>TRIP PLANNER</h3>

    
<div class="trip-start-group">
   <div class="trip-start-header">

  <label for="tripStartInput">Start</label>

  <button

    id="tripUseLocation"

    class="trip-use-location">

    📍 Use My Location

  </button>

</div>   <input

        id="tripStartInput"

        type="search"

        placeholder="Starting city or address"

        autocomplete="off"

      >
      </div>
      <label for="tripDestinationInput">Destination</label>

      <input

        id="tripDestinationInput"

        type="search"

        placeholder="Destination city or address"

        autocomplete="off"

      >

    </div>

  </div>

  <button

    class="trip-planner-submit"

    id="tripPlannerSubmit"

    type="button"

  >

    Plan My Adventure

  </button>

</div>

  
</div>
      <div class="map-explorer-bar" id="mapExplorerBar">

        <button class="explorer-chip active" data-layer="hosts">🏕 Hosts</button>

        <button class="explorer-chip" data-layer="amenities">⚡ Amenities</button>

        <button class="explorer-chip" data-layer="vehicle">🚐 Vehicle</button>

        <button class="explorer-chip" data-layer="services">🛒 Services</button>

        <button class="explorer-chip" data-layer="adventure">🌄 Adventure</button>

        <button class="explorer-chip" data-layer="travel">🗺 Travel</button>

        <button class="explorer-chip" data-layer="events">🎉 Events</button>

        <button class="explorer-chip" data-layer="nomads">🧑‍🤝‍🧑 Nomads Nearby</button>

        <button class="explorer-chip" data-layer="saved">❤️ Saved</button>

      </div>

    </section>

  </main>
<script src="supabase-config.js"></script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyARloTGny6kPM-fcJ3chPejqPJz33pzh48&libraries=routes,places,geometry"></script>

<script src="https://unpkg.com/@googlemaps/markerclusterer/dist/index.min.js"></script>

<script type="module" src="find-map.js?v=10"></script>

<script>

 function enableTripAutocomplete() {

  const startInput = document.getElementById("tripStartInput");

  const destinationInput = document.getElementById("tripDestinationInput");

  if (!window.google?.maps?.places) return;

  if (!startInput || !destinationInput) return;

  const options = {

    fields: ["formatted_address", "geometry", "name"],

    types: ["geocode"],

    componentRestrictions: {

      country: ["ca", "us"]

    }

  };

  new google.maps.places.Autocomplete(startInput, options);

  new google.maps.places.Autocomplete(destinationInput, options);

}
const routeParams = new URLSearchParams(window.location.search);

  const routeStart = routeParams.get("start");

  const routeDestination = routeParams.get("destination");

  async function drawIncomingRoute() {

    if (!routeStart || !routeDestination) return;

    let attempts = 0;

    while (

      (!window.NPP_GOOGLE_MAP || !window.google?.maps) &&

      attempts < 40

    ) {

      await new Promise(resolve => setTimeout(resolve, 250));

      attempts += 1;

    }

    if (!window.NPP_GOOGLE_MAP || !window.google?.maps) {

      alert("The map loaded, but the route system did not connect.");

      return;

    }
        const directionsService =

      new google.maps.DirectionsService();

    const directionsRenderer =

      new google.maps.DirectionsRenderer({

        map: window.NPP_GOOGLE_MAP

      });

    directionsService.route(

      {

        origin: routeStart,

        destination: routeDestination,

        travelMode: google.maps.TravelMode.DRIVING

      },

      (result, status) => {

        if (status === "OK") {

          directionsRenderer.setDirections(result);
          startNavigationButton.hidden = false;

        } else {

          alert(`The route could not be calculated: ${status}`);

        }

      }

    );

  }
enableTripAutocomplete();
  drawIncomingRoute();

</script>

<script src="route-planner.js?v=7"></script>
</body>
</html>
