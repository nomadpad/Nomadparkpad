<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Map | Nomad Park Pad</title>

  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">

  <link rel="stylesheet" href="styles.css">

  <link rel="stylesheet" href="find.css">

</head>

<body>

  <main class="map-only-page">

    <section class="map-view-section">

      <div id="map-message" class="map-message" hidden></div>

      
<div id="traveller-map" class="traveller-map"></div>

<div class="map-action-bar">

  <button class="btn btn-primary" id="map-search-button" type="button">

  Search

</button>
<button

  class="btn btn-route"

  id="trip-planner-button"

  type="button"

  hidden

>

  Trip Planner

</button>
<div class="map-search-panel" id="mapSearchPanel" hidden>

  <input

    id="mapSearchInput"

    type="search"

    placeholder="Search a city, address, or place"

    autocomplete="off"

  >

  <button class="btn btn-primary" id="mapSearchSubmit" type="button">

    Go

  </button>

</div>
<div class="trip-planner-panel" id="tripPlannerPanel" hidden>

  <button

    class="trip-planner-close"

    id="tripPlannerClose"

    type="button"

    aria-label="Close trip planner"

  >

    ×

  </button>

  <p class="trip-planner-kicker">PLAN YOUR ROUTE</p>

  <h2>Find Pads Along Your Drive</h2>

  <div class="trip-planner-layout">

    <div class="trip-planner-brand">

      <img

        src="logo.png"

        alt="Nomad Park Pad"

        class="trip-planner-logo"

      >

    </div>

    <div class="trip-planner-card">

      <h3>TRIP PLANNER</h3>

      <label for="tripStartInput">Start</label>

      <input

        id="tripStartInput"

        type="search"

        placeholder="Starting city or address"

        autocomplete="off"

      >

      <label for="tripDestinationInput">Destination</label>

      <input

        id="tripDestinationInput"

        type="search"

        placeholder="Destination city or address"

        autocomplete="off"

      >

    </div>

  </div>

  <button

    class="trip-planner-submit"

    id="tripPlannerSubmit"

    type="button"

  >

    Find Pads Along My Route

  </button>

</div>

  
</div>
      <div class="map-explorer-bar" id="mapExplorerBar">

        <button class="explorer-chip active" data-layer="hosts">🏕 Hosts</button>

        <button class="explorer-chip" data-layer="amenities">⚡ Amenities</button>

        <button class="explorer-chip" data-layer="vehicle">🚐 Vehicle</button>

        <button class="explorer-chip" data-layer="services">🛒 Services</button>

        <button class="explorer-chip" data-layer="adventure">🌄 Adventure</button>

        <button class="explorer-chip" data-layer="travel">🗺 Travel</button>

        <button class="explorer-chip" data-layer="events">🎉 Events</button>

        <button class="explorer-chip" data-layer="nomads">🧑‍🤝‍🧑 Nomads Nearby</button>

        <button class="explorer-chip" data-layer="saved">❤️ Saved</button>

      </div>

    </section>

  </main>
<script src="supabase-config.js"></script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyARloTGny6kPM-fcJ3chPejqPJz33pzh48&libraries=routes,places,geometry"></script>

<script src="https://unpkg.com/@googlemaps/markerclusterer/dist/index.min.js"></script>
  <script type="module" src="find-map.js?v=5"></script>

</body>

</html>
