<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Traveller Settings | Nomad Park Pad</title>

  <link rel="stylesheet" href="traveller-dashboard.css">

</head>

<body>

  <main class="traveller-settings-page">

    <section class="traveller-settings-card">

      <p class="settings-kicker">TRAVELLER SETTINGS</p>

      <h1>Settings</h1>

      <p class="settings-intro">

        Personalize your profile and your dashboard.

      </p>

      <div class="settings-choice-grid">

        <a

          href="traveller-profile-edit.html"

          class="settings-choice-card"

        >

          <span class="settings-choice-icon">👤</span>

          <div>

            <strong>Profile</strong>

            <p>

              Profile, emoji, notifications, password and account settings.

            </p>

          </div>

        </a>

        <a

          href="#"

          class="settings-choice-card"

          id="dashboardSettingsButton"

        >

          <span class="settings-choice-icon">🎨</span>

          <div>

            <strong>Dashboard</strong>

            <p>

              Customize your traveller room and dashboard colour.

            </p>

          </div>

        </a>

      </div>

      <a

        href="traveller-dashboard.html"

        class="settings-back-button"

      >

        ← Back to Dashboard

      </a>

    </section>

  </main>

</body>

</html>
